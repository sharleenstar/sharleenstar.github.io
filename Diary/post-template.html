<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ✏️ 1. PAGE TITLE (shows in the browser tab) -->
<title>Post title | Sandy Boots &amp; Slapshots</title>

<!-- 🎨 Shared design. "../" means "go up one folder", so this file is meant to live
     inside a folder like diary/. If you put a post in the main folder instead,
     change this to  href="style.css" -->
<link rel="stylesheet" href="../style.css">
</head>

<body>
<main class="wrap">

  <!-- ⬅️ Back button. Change #diary to #home, #books, #screen, #eng or #hockey
       to return to a different tab -->
  <a class="back-btn" href="../index.html#diary">← Back to Home</a>

  <article class="post">

    <header class="post-head">
      <!-- ✏️ 2. TITLE + DATE -->
      <h1>Your post title</h1>
      <div class="meta">1 January 2027</div>
    </header>

    <!-- 📸 3. POLAROID PHOTO. Save your image in an images/ folder in the main
         site folder, then use ../images/photo.jpg (the ../ is needed from inside a folder) -->
    <figure class="polaroid">
      <div class="photo"><img src="../images/photo.jpg" alt="Describe the photo"></div>
      <figcaption><span class="hand" style="font-size:1.5rem">a little caption</span></figcaption>
    </figure>

    <!-- 📝 4. YOUR TEXT. One <p>...</p> per paragraph. Use <h2>Subheading</h2> for headings. -->
    <div class="card post-body">
      <p>Write your first paragraph here.</p>
      <p>Press enter, wrap the next paragraph in its own p tags, and keep going.</p>
    </div>

  </article>
</main>

<footer style="text-align:center;font-family:var(--hand);font-size:1.4rem;color:var(--sand-dark);padding:20px 20px 50px">made with love, sunscreen &amp; too much coffee ♡</footer>
</body>
</html>
